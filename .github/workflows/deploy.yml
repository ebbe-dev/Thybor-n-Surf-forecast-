name: Deploy til GitHub Pages

# To job, som GitHubs egen skabelon: build lægger dist op som artefakt, og
# deploy lægger artefaktet ud. I ét job fandt deploy-pages 16/10/2026 to
# gange "0 artifact(s)" lige efter en vellykket upload (GitHubs egen
# forsinkelse), og en genkørsel af jobbet lagde et artefakt nr. 2 op, så
# deploy-pages afviste ("Multiple artifacts named github-pages"). Med to
# job kan deploy-jobbet køres igen alene og finder præcis ét artefakt.
on:
  push:
    branches: [claude/byg-tangen-surf-app-yox769]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
