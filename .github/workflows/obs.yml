name: Målinger fra kysten (obs.json)

# Hver halve time: Kystdirektoratets bølgebøje ved Fjaltring og DMI's
# vandstand ved Thyborøn → obs.json på grenen "data", som appen læser.
# Kør manuelt med probe=true for at se svar-hoveder og format i loggen.
#
# GitHubs schedule er best-effort: 16/10/2026 affyrede den ingen af de
# første seks planlagte kørsler (7,37 * * * *) i tre timer efter, at filen
# kom på default-grenen, mens manuelle kørsler virkede. Minuttallet er
# skiftet for at få GitHub til at registrere schedulen igen (en ændring i
# filen på default-grenen gør det). Appen viser altid målingens eget
# klokkeslæt og mærker målinger over tre timer som gamle, så en forsinket
# kørsel kan aldrig udgive sig for frisk.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Skriv svar-hoveder og første linjer til loggen"
        type: boolean
        default: false
      kdi_tz:
        description: "Bøjens tidszone (UTC — målt 16/10/2026; eller Europe/Copenhagen)"
        type: string
        default: "UTC"
      deep:
        description: "Dyb undersøgelse af kilderne (idents, parametre, sider)"
        type: boolean
        default: false
      openmeteo:
        description: "Probe af Open-Meteo: bølgemodeller (models=), ekstra variabler, DMI i best_match"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: obs
  cancel-in-progress: false

jobs:
  obs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent målinger
        env:
          PROBE: ${{ inputs.deep && '2' || (inputs.probe && '1' || '0') }}
          KDI_TZ: ${{ inputs.kdi_tz || 'UTC' }}
        run: node scripts/fetch-obs.mjs
      - name: Læg obs.json på grenen data
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          git init -q -b data
          cp "$GITHUB_WORKSPACE/obs.json" .
          git add obs.json
          git -c user.name=obs-bot -c user.email=obs-bot@users.noreply.github.com commit -q -m "obs $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data
      - name: Probe af Open-Meteo (kun log)
        if: ${{ inputs.openmeteo }}
        run: node scripts/probe-openmeteo.mjs
